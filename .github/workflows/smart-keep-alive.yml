name: Smart Keep-Alive
on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  smart-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the bot function warm
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # Unconditional ping: the first message after an idle period was slow
          # because the function had to cold-start. Keep it always warm.
          curl -s -o /dev/null -w "Ping status: %{http_code}\n" "$SUPABASE_URL/functions/v1/telegram"
